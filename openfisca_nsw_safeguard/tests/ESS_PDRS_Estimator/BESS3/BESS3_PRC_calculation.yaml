- name: Test clause of 8.1.7 of prc calculation
  period: 2026-05-01
  absolute_error_margin: 0.1
  input:
    BESS3_battery_capacity_input:
      [
        50.0,
        10.0, # battery_capacity_input less than 20
        201.0, # battery_capacity_input more than 200
        30.0,
        40.0,
        35.0,
        48.0
      ]
    BESS3_number_of_dwellings_input:
      [
        4.0, 
        4.0,
        4.0, 
        5.0, 
        3.0, # number_of_dwellings_input less than 4
        5.0,
        5.0
      ]
    BESS3_inverter_output_input:
      [
        9.0,
        6.0,
        45.0,
        5.0,
        12.0,
        8.0,
        5.0 # battery_capacity_input more than inverter_output_input * 6
      ]
  output:
    BESS3_PRC_is_eligible:
      [
        1,
        0,
        0,
        1,
        0,
        1,
        0
      ]

